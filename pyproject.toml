[project]
name = "cdf"
version = "0.1.0"
description = "Capability Drift Framework"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "seaborn",
  "pydantic",
  "pyyaml",
  "openai",
  "google-genai",
  "tqdm"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cdf*"]
exclude = ["experiments*"]

